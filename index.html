<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استبيان تطبيق وسيطك</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: system-ui, Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; text-align: center; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; font-size: 20px; margin-bottom: 10px; }
        .progress { color: #d35400; font-weight: bold; font-size: 14px; margin-bottom: 20px; background: #fef5e7; padding: 8px; border-radius: 6px; }
        .question-card { margin-bottom: 25px; text-align: right; }
        label { font-size: 17px; font-weight: bold; color: #34495e; display: block; margin-bottom: 12px; line-height: 1.4; }
        input[type="text"], select { width: 100%; padding: 14px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; background: #fafafa; }
        input[type="text"]:focus, select:focus { border-color: #2980b9; background: #fff; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-next { background-color: #27ae60; color: white; flex: 2; }
        .btn-prev { background-color: #7f8c8d; color: white; flex: 1; }
        .actions-section { margin: 20px auto; background: white; padding: 15px; border-radius: 12px; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-export-img { background-color: #e67e22; color: white; width: 100%; font-size: 16px; margin-bottom: 10px; }
        .btn-edit-list { background-color: #2980b9; color: white; width: 100%; font-size: 16px; margin-bottom: 10px; }
        .btn-clear { background-color: #c0392b; color: white; width: 100%; font-size: 13px; }
        #renderHiddenArea { position: absolute; right: -9999px; top: -9999px; }
        .paper-page { width: 1200px; background: white; padding: 20px; box-sizing: border-box; border: 2px solid #000; direction: rtl; font-family: sans-serif; }
        .paper-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .paper-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        .paper-table th, .paper-table td { border: 1px solid #000; padding: 6px 3px; }
        .paper-table th { background-color: #eaeaea; color: #000; font-weight: bold; }
        
        /* تنسيق نافذة تعديل الفعاليات */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); overflow: auto; }
        .modal-content { background: white; margin: 10% auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; text-align: right; }
        .event-item { background: #f8f9fa; padding: 10px; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .btn-edit-item { background: #3498db; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>استبيان تطبيق وسيطك الميداني</h2>
    <div class="progress" id="progress">جاري التحميل...</div>
    <div class="question-card">
        <label id="questionText"></label>
        <div id="inputContainer"></div>
    </div>
    <div class="btn-group">
        <button class="btn-prev" id="prevBtn" type="button" style="display:none;">السابق</button>
        <button class="btn-next" id="nextBtn" type="button">التالي ⬅️</button>
    </div>
</div>

<div class="actions-section">
    <h3 style="margin:5px 0 15px 0;">عدد الفعاليات المحفوظة: (<span id="totalCount">0</span>)</h3>
    <button class="btn-export-img" id="exportBtn" type="button">📸 استخراج الصور الورقية (20 فعالية/صورة)</button>
    <button class="btn-edit-list" id="editListBtn" type="button">✏️ تعديل فعالية محفوظة</button>
    <button class="btn-clear" id="clearBtn" type="button">🗑️ مسح كل البيانات</button>
</div>

<!-- نافذة اختيار الفعالية للتعديل -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">اختر الفعالية المراد تعديلها</h3>
        <div id="eventsList" style="max-height: 300px; overflow-y: auto;"></div>
        <button onclick="closeModal()" style="width: 100%; margin-top: 15px; background: #7f8c8d; color: white;">إغلاق</button>
    </div>
</div>

<div id="renderHiddenArea"></div>

<script>
const questions = [
    { title: "ما هي الفعالية؟", type: "text" },
    { title: "الشخص المسؤول", type: "text" },
    { title: "الاختصاص", type: "text" },
    { title: "المنطقة", type: "text" },
    { title: "العنوان التفصيلي", type: "text" },
    { title: "الهاتف", type: "text" },
    { title: "الموبايل", type: "text" },
    { title: "صفحات السوشيال ميديا", type: "text" },
    { title: "هل تقوم بالإعلان عن الخدمات عبر السوشيال ميديا؟", type: "select", options: ["نعم", "لا"] },
    { title: "هل قمت ببيع أو شراء منتج عبر تطبيق إلكتروني سابقاً؟", type: "select", options: ["نعم", "لا"] },
    { title: "هل سمعت بتطبيق وسيطك سابقاً؟", type: "select", options: ["نعم", "لا"] },
    { title: "هل ترغب بتجربة تطبيق وسيطك؟", type: "select", options: ["نعم", "لا", "ربما"] },
    { title: "تقييم الفعالية", type: "select", options: ["ممتاز", "جيد جداً", "جيد", "مقبول", "ضعيف"] },
    { title: "الاهتمام بالتطبيق", type: "select", options: ["عالي جداً", "عالي", "متوسط", "ضعيف", "غير مهتم"] },
    { title: "ملاحظات", type: "text" }
];

let currentQ = 0;
let currentAnswers = [];
let allData = [];
let editingIndex = -1; // -1 تعني وضع إضافة جديدة، ورقم آخر يعني تعديل فعالية سابقة

try {
    let saved = localStorage.getItem('surveyData');
    if (saved) allData = JSON.parse(saved);
} catch(e) { allData = []; }

function render() {
    let activeEventNum = editingIndex !== -1 ? (editingIndex + 1) : (allData.length + 1);
    let modeText = editingIndex !== -1 ? " (وضع التعديل) ✏️" : "";
    document.getElementById("progress").innerText = `الفعالية رقم (${activeEventNum})${modeText} - السؤال ${currentQ + 1} من ${questions.length}`;
    document.getElementById("questionText").innerText = `${currentQ + 1}. ${questions[currentQ].title}`;
    
    const container = document.getElementById("inputContainer");
    let val = currentAnswers[currentQ] || '';

    if (questions[currentQ].type === "select") {
        let optionsHtml = questions[currentQ].options.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('');
        container.innerHTML = `<select id="ansElem">${optionsHtml}</select>`;
    } else {
        container.innerHTML = `<input type="text" id="ansElem" value="${val}" placeholder="أدخل الإجابة هنا...">`;
    }

    document.getElementById("prevBtn").style.display = currentQ > 0 ? "block" : "none";
    
    if (editingIndex !== -1 && currentQ === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "💾 حفظ التعديل";
    } else if (currentQ === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "💾 حفظ الفعالية والتالي";
    } else {
        document.getElementById("nextBtn").innerText = "التالي ⬅️";
    }
    
    document.getElementById("totalCount").innerText = allData.length;
}

function saveCurrentInput() {
    let elem = document.getElementById("ansElem");
    if (elem) currentAnswers[currentQ] = elem.value;
}

document.getElementById("nextBtn").onclick = function() {
    saveCurrentInput();
    if (currentQ < questions.length - 1) {
        currentQ++;
        render();
    } else {
        if (editingIndex !== -1) {
            allData[editingIndex] = [...currentAnswers];
            alert(`✅ تم تعديل الفعالية رقم (${editingIndex + 1}) بنجاح!`);
            editingIndex = -1;
        } else {
            allData.push([...currentAnswers]);
            alert(`✅ تم حفظ الفعالية رقم (${allData.length}) بنجاح!`);
        }
        try { localStorage.setItem('surveyData', JSON.stringify(allData)); } catch(e) {}
        currentAnswers = [];
        currentQ = 0;
        render();
    }
};

document.getElementById("prevBtn").onclick = function() {
    saveCurrentInput();
    if (currentQ > 0) {
        currentQ--;
        render();
    }
};

// وظائف التعديل
document.getElementById("editListBtn").onclick = function() {
    if (allData.length === 0) {
        alert("لا توجد فعاليات محفوظة لتعديلها!");
        return;
    }
    let listHtml = "";
    allData.forEach((item, index) => {
        let eventName = item[0] ? item[0] : "بدون اسم";
        listHtml += `
            <div class="event-item">
                <span><b>#${index + 1}</b> - ${eventName}</span>
                <button class="btn-edit-item" onclick="startEdit(${index})">تعديل</button>
            </div>
        `;
    });
    document.getElementById("eventsList").innerHTML = listHtml;
    document.getElementById("editModal").style.display = "block";
};

function closeModal() {
    document.getElementById("editModal").style.display = "none";
}

function startEdit(index) {
    editingIndex = index;
    currentAnswers = [...allData[index]];
    currentQ = 0;
    closeModal();
    render();
}

document.getElementById("exportBtn").onclick = async function() {
    if (allData.length === 0) {
        alert("لا توجد فعاليات مخزنة لحفظها كصورة!");
        return;
    }
    const hiddenArea = document.getElementById("renderHiddenArea");
    hiddenArea.innerHTML = "";
    const chunkSize = 20;
    const totalPages = Math.ceil(allData.length / chunkSize);

    for (let page = 0; page < totalPages; page++) {
        let pageData = allData.slice(page * chunkSize, (page + 1) * chunkSize);
        let pageDiv = document.createElement("div");
        pageDiv.className = "paper-page";
        
        let rowsHtml = pageData.map((row, idx) => {
            let rowNum = (page * chunkSize) + idx + 1;
            return `<tr><td><b>${rowNum}</b></td>${row.map(c => `<td>${c || '-'}</td>`).join('')}</tr>`;
        }).join('');

        pageDiv.innerHTML = `
            <div class="paper-header">
                <h2 style="margin:0;">استبيان مسحي ميداني - تطبيق وسيطك</h2>
                <div><b>الصفحة ${page + 1} من ${totalPages}</b></div>
            </div>
            <table class="paper-table">
                <thead>
                    <tr>
                        <th>#</th><th>الفعالية</th><th>المسؤول</th><th>الاختصاص</th><th>المنطقة</th><th>العنوان</th><th>الهاتف</th><th>الموبايل</th><th>السوشيال</th><th>إعلان</th><th>بيع/شراء</th><th>سمعت بـوسيطك</th><th>ترغب بالتجربة</th><th>التقييم</th><th>الاهتمام</th><th>ملاحظات</th>
                    </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        `;
        hiddenArea.appendChild(pageDiv);

        await html2canvas(pageDiv, { scale: 2 }).then(canvas => {
            let imgData = canvas.toDataURL("image/png");
            let win = window.open("");
            if(win) {
                win.document.write(`
                    <html>
                    <head><title>تحميل الصورة</title></head>
                    <body style="text-align:center; padding:20px; font-family:sans-serif;">
                        <h3>اضغط مطولاً على الصورة لحفظها أو استخدم الزر أدناه:</h3>
                        <a href="${imgData}" download="استبيان_وسيطك_صفحة_${page + 1}.png" style="display:inline-block; padding:15px 25px; background:#e67e22; color:white; text-decoration:none; border-radius:8px; font-weight:bold; font-size:18px;">💾 تنزيل الصورة على الهاتف</a>
                        <br><br>
                        <img src="${imgData}" style="max-width:100%; border:1px solid #ccc; border-radius:8px;" />
                    </body>
                    </html>
                `);
            } else {
                let a = document.createElement("a");
                a.href = imgData;
                a.download = `استبيان_وسيطك_صفحة_${page + 1}.png`;
                a.target = "_blank";
                a.click();
            }
        });
    }
};

document.getElementById("clearBtn").onclick = function() {
    if (confirm("هل أنت تأكد من مسح جميع الفعاليات؟")) {
        localStorage.removeItem('surveyData');
        allData = [];
        currentAnswers = [];
        currentQ = 0;
        editingIndex = -1;
        render();
    }
};

render();
</script>
</body>
</html>
